name: Validate Fair Sales Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check Fair-sales-manager/app.js
          node --check Fair-sales-manager/sw.js
          node --check Fair-sales-manager/config.js
      - name: Validate HTML assets and PWA configuration
        run: node scripts/validate-fair-sales-manager.mjs
